<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AuditIntern Gateway</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 920px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.5;
        }
        h1 { margin-top: 0; }
        .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin-bottom: .75rem; }
        label { font-weight: 600; }
        select, textarea, button {
            font: inherit;
            padding: .45rem .6rem;
            border-radius: 6px;
            border: 1px solid #8884;
            background: #fff2;
        }
        textarea { width: 100%; min-height: 6rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
        button {
            cursor: pointer;
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
            font-weight: 600;
        }
        button:disabled { opacity: .6; cursor: not-allowed; }
        #log {
            margin-top: 1rem;
            padding: .75rem 1rem;
            border-radius: 6px;
            background: #1118;
            color: #e6e6e6;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: .85rem;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 10rem;
            max-height: 60vh;
            overflow: auto;
        }
        .event-started { color: #93c5fd; }
        .event-result  { color: #a7f3d0; }
        .event-done    { color: #fcd34d; }
        .event-error   { color: #fca5a5; }
    </style>
</head>
<body>
    <h1>AuditIntern Gateway</h1>
    <p>Thin Gateway UI. Pick an intent, edit <code>params</code>, and stream the result via SSE.
       Under the hood the same intents are exposed to <code>opencode</code> through our MCP server
       (<code>python -m src.mcp_server.server</code>).</p>

    <div class="row">
        <label for="intent">Intent:</label>
        <select id="intent"><option>loading…</option></select>
        <button id="run">Run</button>
        <button id="clear" style="background:#64748b;border-color:#64748b">Clear log</button>
    </div>

    <label for="params">Params (JSON):</label>
    <textarea id="params" spellcheck="false">{}</textarea>

    <pre id="log" aria-live="polite"></pre>

    <script>
        const intentSel = document.getElementById("intent");
        const paramsTa  = document.getElementById("params");
        const runBtn    = document.getElementById("run");
        const clearBtn  = document.getElementById("clear");
        const logEl     = document.getElementById("log");

        let currentSource = null;

        function append(cls, text) {
            const span = document.createElement("span");
            span.className = cls;
            span.textContent = text + "\n";
            logEl.appendChild(span);
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function loadIntents() {
            try {
                const r = await fetch("/gateway/intents");
                const j = await r.json();
                intentSel.innerHTML = "";
                for (const name of j.intents) {
                    const opt = document.createElement("option");
                    opt.value = name;
                    opt.textContent = name;
                    intentSel.appendChild(opt);
                }
            } catch (e) {
                append("event-error", "Failed to load intents: " + e);
            }
        }

        function run() {
            // Validate params JSON before opening the SSE stream.
            let parsed;
            try {
                parsed = JSON.parse(paramsTa.value || "{}");
                if (parsed === null || typeof parsed !== "object" || Array.isArray(parsed)) {
                    throw new Error("params must be a JSON object");
                }
            } catch (e) {
                append("event-error", "Invalid params JSON: " + e.message);
                return;
            }

            if (currentSource) { currentSource.close(); }

            const intent = intentSel.value;
            const url = "/gateway/stream?intent=" + encodeURIComponent(intent)
                      + "&params=" + encodeURIComponent(JSON.stringify(parsed));

            append("event-started", "→ streaming " + intent + " …");
            runBtn.disabled = true;

            const es = new EventSource(url);
            currentSource = es;

            const finish = () => { runBtn.disabled = false; es.close(); currentSource = null; };

            es.addEventListener("started", ev => append("event-started", "[started] " + ev.data));
            es.addEventListener("result",  ev => append("event-result",  "[result]  " + ev.data));
            es.addEventListener("error",   ev => { append("event-error", "[error]   " + (ev.data || "stream error")); finish(); });
            es.addEventListener("done",    ev => { append("event-done",   "[done]    " + ev.data); finish(); });
            es.onerror = () => { append("event-error", "[sse]     connection closed"); finish(); };
        }

        runBtn.addEventListener("click", run);
        clearBtn.addEventListener("click", () => { logEl.textContent = ""; });
        loadIntents();
    </script>
</body>
</html>
